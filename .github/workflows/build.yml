name: Build

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-slim
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: "latest"
            - name: Check out the repository code
              uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - name: Build front-end
              run: |
                  cd ${{ github.workspace }}/solid-src
                  pnpm i
                  pnpm build
            - name: Package application
              env:
                  NEUTRALINO_VERSION: v6.10.0
              run: |
                  cd ${{ github.workspace }}
                  wget https://github.com/neutralinojs/neutralinojs/releases/download/${NEUTRALINO_VERSION}/neutralinojs-${NEUTRALINO_VERSION}.zip
                  unzip neutralinojs-${NEUTRALINO_VERSION}.zip -d bin/
                  pnpx --allow-build=bufferutil --allow-build=es5-ext --allow-build=utf-8-validate @neutralinojs/neu build
            - uses: actions/upload-artifact@v7
              with:
                  name: vencoder-experimental
                  path: ${{ github.workspace }}/dist/vencoder/
